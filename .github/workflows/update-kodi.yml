name: Update Kodi webOS Nightly

on:
  workflow_dispatch:

  schedule:
    # 每 6 小时检查一次
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: kodi-nightly-update
  cancel-in-progress: false


jobs:
  update:
    runs-on: ubuntu-latest

    env:
      KODI_NIGHTLY_BASE: https://mirrors.kodi.tv/nightlies/webos/master
      KODI_GITHUB_REPO: xbmc/xbmc
      RELEASE_TAG: kodi-nightly


    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Install required tools
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            jq \
            binutils \
            zstd \
            xz-utils \
            bzip2


      # ============================================================
      # 2. Detect latest Kodi webOS Nightly
      # ============================================================

      - name: Detect latest Kodi nightly
        id: detect
        shell: bash

        run: |
          set -euo pipefail


          echo "Fetching Kodi nightly directory..."

          HTML="$(
            curl -fsSL \
              "${KODI_NIGHTLY_BASE}/"
          )"


          mapfile -t FILES < <(
            printf '%s' "$HTML" |
            grep -oE \
              'org\.xbmc\.kodi_[0-9]{8}-[0-9a-f]+-master_arm\.ipk' |
            sort -u |
            sort -r
          )


          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "ERROR: No Kodi webOS nightly found."
            exit 1
          fi


          FILE="${FILES[0]}"


          BUILD_DATE="$(
            printf '%s' "$FILE" |
            sed -E \
              's/^org\.xbmc\.kodi_([0-9]{8})-.*/\1/'
          )"


          NEW_COMMIT="$(
            printf '%s' "$FILE" |
            sed -E \
              's/^org\.xbmc\.kodi_[0-9]{8}-([0-9a-f]+)-master_arm\.ipk$/\1/'
          )"


          SOURCE_URL="${KODI_NIGHTLY_BASE}/${FILE}"


          # ========================================================
          # Read previous state
          # ========================================================

          OLD_COMMIT=""
          OLD_FEED_VERSION=""


          if [ -f state.json ]; then

            OLD_COMMIT="$(
              jq -r \
                '.sourceCommit // empty' \
                state.json
            )"


            OLD_FEED_VERSION="$(
              jq -r \
                '.feedVersion // empty' \
                state.json
            )"

          fi


          # ========================================================
          # HARD RULE:
          #
          # Same Kodi commit = NO UPDATE
          #
          # Doesn't matter:
          # - date changed
          # - workflow manually triggered
          # - workflow file changed
          #
          # Absolutely nothing gets rebuilt.
          # ========================================================

          if [ -n "$OLD_COMMIT" ] && \
             [ "$NEW_COMMIT" = "$OLD_COMMIT" ]; then

            echo
            echo "=============================================="
            echo "Kodi source commit has NOT changed."
            echo
            echo "Current commit:"
            echo "$NEW_COMMIT"
            echo
            echo "No package will be rebuilt."
            echo "No repo.json update."
            echo "No version change."
            echo "=============================================="
            echo

            echo "changed=false" >> "$GITHUB_OUTPUT"

            exit 0

          fi


          # ========================================================
          # Determine previous commit
          # ========================================================

          COMPARE_FROM=""


          # Normal update
          if [ -n "$OLD_COMMIT" ]; then

            COMPARE_FROM="$OLD_COMMIT"

          # First run:
          # use second newest official nightly
          elif [ "${#FILES[@]}" -ge 2 ]; then

            PREVIOUS_FILE="${FILES[1]}"


            COMPARE_FROM="$(
              printf '%s' "$PREVIOUS_FILE" |
              sed -E \
                's/^org\.xbmc\.kodi_[0-9]{8}-([0-9a-f]+)-master_arm\.ipk$/\1/'
            )"

          fi


          # ========================================================
          # Read Kodi upstream version
          # ========================================================

          VERSION_TXT="$(
            curl -fsSL \
              "https://raw.githubusercontent.com/${KODI_GITHUB_REPO}/${NEW_COMMIT}/version.txt"
          )"


          KODI_MAJOR="$(
            printf '%s\n' "$VERSION_TXT" |
            awk '$1=="VERSION_MAJOR"{print $2}'
          )"


          KODI_MINOR="$(
            printf '%s\n' "$VERSION_TXT" |
            awk '$1=="VERSION_MINOR"{print $2}'
          )"


          KODI_TAG="$(
            printf '%s\n' "$VERSION_TXT" |
            awk '$1=="VERSION_TAG"{print $2}'
          )"


          UPSTREAM_VERSION="$(
            printf '%s\n' "$VERSION_TXT" |
            awk '$1=="VERSION_CODE"{print $2}'
          )"


          if [ -z "$KODI_MAJOR" ]; then
            echo "ERROR: Could not determine Kodi version."
            exit 1
          fi


          if [ -n "$KODI_TAG" ]; then

            DISPLAY_VERSION="${KODI_MAJOR}.${KODI_MINOR}-${KODI_TAG}"

          else

            DISPLAY_VERSION="${KODI_MAJOR}.${KODI_MINOR}"

          fi


          # ========================================================
          # Homebrew Nightly Version
          #
          # Format:
          #
          # KodiMajor.YY.Revision
          #
          # Example:
          #
          # 23.26.275
          #
          #
          # RULE:
          #
          # First build:
          # revision = day-of-year
          #
          # New commit:
          #
          # revision =
          #
          # max(
          #   current day-of-year,
          #   previous revision + 1
          # )
          #
          # ========================================================

          YEAR="${BUILD_DATE:0:4}"
          MONTH="${BUILD_DATE:4:2}"
          DAY="${BUILD_DATE:6:2}"

          YY="${YEAR:2:2}"


          DAY_OF_YEAR="$(
            date \
              -d "${YEAR}-${MONTH}-${DAY}" \
              +%j
          )"


          DAY_OF_YEAR="$((10#$DAY_OF_YEAR))"


          # --------------------------------------------------------
          # First run
          # --------------------------------------------------------

          if [ -z "$OLD_FEED_VERSION" ]; then

            REVISION="$DAY_OF_YEAR"

            FEED_VERSION="${KODI_MAJOR}.${YY}.${REVISION}"


          # --------------------------------------------------------
          # Existing feed + NEW COMMIT
          # --------------------------------------------------------

          else

            OLD_MAJOR="$(
              printf '%s' "$OLD_FEED_VERSION" |
              awk -F. '{print $1}'
            )"


            OLD_YEAR="$(
              printf '%s' "$OLD_FEED_VERSION" |
              awk -F. '{print $2}'
            )"


            OLD_REVISION="$(
              printf '%s' "$OLD_FEED_VERSION" |
              awk -F. '{print $3}'
            )"


            # Kodi major or calendar year changed
            if [ "$OLD_MAJOR" != "$KODI_MAJOR" ] || \
               [ "$OLD_YEAR" != "$YY" ]; then

              REVISION="$DAY_OF_YEAR"


            else

              if [[ "$OLD_REVISION" =~ ^[0-9]+$ ]]; then

                NEXT_REVISION="$((OLD_REVISION + 1))"

              else

                NEXT_REVISION="$DAY_OF_YEAR"

              fi


              # Use whichever is greater:
              #
              # current calendar day
              # or
              # previous revision + 1

              if [ "$DAY_OF_YEAR" -gt "$NEXT_REVISION" ]; then

                REVISION="$DAY_OF_YEAR"

              else

                REVISION="$NEXT_REVISION"

              fi

            fi


            FEED_VERSION="${KODI_MAJOR}.${YY}.${REVISION}"

          fi


          # ========================================================
          # Repository update time
          # ========================================================

          UPDATED_UTC="$(
            date -u \
              '+%Y-%m-%d %H:%M:%S UTC'
          )"


          echo
          echo "=============================================="
          echo "NEW Kodi Nightly detected"
          echo "=============================================="
          echo
          echo "Kodi:"
          echo "$DISPLAY_VERSION"
          echo
          echo "Official webOS package version:"
          echo "$UPSTREAM_VERSION"
          echo
          echo "Nightly:"
          echo "$BUILD_DATE-$NEW_COMMIT"
          echo
          echo "Previous commit:"
          echo "$COMPARE_FROM"
          echo
          echo "Homebrew version:"
          echo "$FEED_VERSION"
          echo
          echo "Feed updated:"
          echo "$UPDATED_UTC"
          echo
          echo "=============================================="


          {
            echo "changed=true"

            echo "file=$FILE"

            echo "build_date=$BUILD_DATE"

            echo "new_commit=$NEW_COMMIT"

            echo "compare_from=$COMPARE_FROM"

            echo "source_url=$SOURCE_URL"

            echo "display_version=$DISPLAY_VERSION"

            echo "upstream_version=$UPSTREAM_VERSION"

            echo "feed_version=$FEED_VERSION"

            echo "updated_utc=$UPDATED_UTC"

          } >> "$GITHUB_OUTPUT"


      # ============================================================
      # 3. Get ALL commits between Nightlies
      # ============================================================

      - name: Get all commits since previous nightly
        if: steps.detect.outputs.changed == 'true'

        id: changelog

        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}

          OLD_COMMIT: ${{ steps.detect.outputs.compare_from }}

          NEW_COMMIT: ${{ steps.detect.outputs.new_commit }}

        run: |
          set -euo pipefail


          rm -rf compare-pages
          mkdir -p compare-pages


          if [ -z "$OLD_COMMIT" ]; then

            echo \
              "- No previous nightly commit available." \
              > commits.md

            echo \
              "commit_count=0" \
              >> "$GITHUB_OUTPUT"

            exit 0

          fi


          echo
          echo "Comparing:"
          echo "$OLD_COMMIT ... $NEW_COMMIT"
          echo


          PAGE=1


          while true
          do

            URL="https://api.github.com/repos/${KODI_GITHUB_REPO}/compare/${OLD_COMMIT}...${NEW_COMMIT}?per_page=100&page=${PAGE}"


            echo "Fetching page $PAGE..."


            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$URL" \
              -o "compare-pages/page-${PAGE}.json"


            COUNT="$(
              jq \
                '.commits | length' \
                "compare-pages/page-${PAGE}.json"
            )"


            echo "Commits on page: $COUNT"


            if [ "$COUNT" -eq 0 ]; then
              break
            fi


            if [ "$COUNT" -lt 100 ]; then
              break
            fi


            PAGE="$((PAGE + 1))"

          done


          python3 <<'PY'

          import glob
          import json
          import re


          def page_number(filename):

              match = re.search(
                  r"page-(\d+)\.json$",
                  filename
              )

              return int(match.group(1)) if match else 0


          files = sorted(
              glob.glob(
                  "compare-pages/page-*.json"
              ),
              key=page_number
          )


          commits = []
          seen = set()


          for filename in files:

              with open(
                  filename,
                  "r",
                  encoding="utf-8"
              ) as f:

                  try:
                      data = json.load(f)

                  except Exception:
                      continue


              for item in data.get(
                  "commits",
                  []
              ):

                  full_sha = item.get(
                      "sha",
                      ""
                  )


                  if not full_sha:
                      continue


                  if full_sha in seen:
                      continue


                  seen.add(full_sha)


                  message = (
                      item
                      .get("commit", {})
                      .get("message", "")
                      .splitlines()[0]
                      .strip()
                  )


                  if not message:
                      message = "(no commit message)"


                  message = (
                      message
                      .replace("`", "'")
                      .replace("\r", " ")
                      .replace("\n", " ")
                  )


                  commits.append(
                      (
                          full_sha,
                          full_sha[:8],
                          message
                      )
                  )


          with open(
              "commits.md",
              "w",
              encoding="utf-8"
          ) as f:

              if not commits:

                  f.write(
                      "- No commits found between these nightly builds.\n"
                  )

              else:

                  for full_sha, short_sha, message in commits:

                      url = (
                          "https://github.com/"
                          "xbmc/xbmc/commit/"
                          + full_sha
                      )


                      f.write(
                          f"- [`{short_sha}`]({url}) {message}\n"
                      )


          with open(
              "commit-count.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  str(len(commits))
              )


          print(
              f"Total commits: {len(commits)}"
          )

          PY


          COMMIT_COUNT="$(
            cat commit-count.txt
          )"


          echo \
            "commit_count=$COMMIT_COUNT" \
            >> "$GITHUB_OUTPUT"


          echo
          echo "=============================================="
          echo "ALL COMMITS"
          echo "=============================================="

          cat commits.md

          echo "=============================================="


      # ============================================================
      # 4. Download official Kodi Nightly
      # ============================================================

      - name: Download official Kodi nightly
        if: steps.detect.outputs.changed == 'true'

        shell: bash

        env:
          SOURCE_URL: ${{ steps.detect.outputs.source_url }}

        run: |
          set -euo pipefail


          echo "Downloading:"
          echo "$SOURCE_URL"


          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            "$SOURCE_URL" \
            -o kodi-source.ipk


          echo
          ls -lh kodi-source.ipk


          echo
          echo "Official SHA256:"

          sha256sum kodi-source.ipk


      # ============================================================
      # 5. Modify ONLY webOS package version metadata
      # ============================================================

      - name: Repackage with Homebrew nightly version
        if: steps.detect.outputs.changed == 'true'

        shell: bash

        env:
          FEED_VERSION: ${{ steps.detect.outputs.feed_version }}

        run: |
          set -euo pipefail


          rm -rf ipk-work
          mkdir -p ipk-work

          cd ipk-work


          ar x ../kodi-source.ipk


          CONTROL_ARCHIVE="$(
            find . \
              -maxdepth 1 \
              -type f \
              -name 'control.tar.*' |
            head -n 1
          )"


          DATA_ARCHIVE="$(
            find . \
              -maxdepth 1 \
              -type f \
              -name 'data.tar.*' |
            head -n 1
          )"


          if [ -z "$CONTROL_ARCHIVE" ] || \
             [ -z "$DATA_ARCHIVE" ]; then

            echo "ERROR: IPK archive structure not found."

            ls -la

            exit 1

          fi


          CONTROL_NAME="${CONTROL_ARCHIVE#./}"
          DATA_NAME="${DATA_ARCHIVE#./}"


          mkdir -p control
          mkdir -p data


          extract_archive() {

            ARCHIVE="$1"
            DEST="$2"


            case "$ARCHIVE" in

              *.tar.gz|*.tgz)

                tar -xzf \
                  "$ARCHIVE" \
                  -C "$DEST"
                ;;


              *.tar.xz)

                tar -xJf \
                  "$ARCHIVE" \
                  -C "$DEST"
                ;;


              *.tar.zst|*.tar.zstd)

                tar \
                  --zstd \
                  -xf "$ARCHIVE" \
                  -C "$DEST"
                ;;


              *.tar.bz2)

                tar -xjf \
                  "$ARCHIVE" \
                  -C "$DEST"
                ;;


              *)

                tar -xf \
                  "$ARCHIVE" \
                  -C "$DEST"
                ;;

            esac

          }


          extract_archive \
            "$CONTROL_ARCHIVE" \
            control


          extract_archive \
            "$DATA_ARCHIVE" \
            data


          # ========================================================
          # appinfo.json
          # ========================================================

          APPINFO="$(
            find data \
              -type f \
              -path '*/org.xbmc.kodi/appinfo.json' |
            head -n 1
          )"


          if [ -z "$APPINFO" ]; then

            echo "ERROR: Kodi appinfo.json not found."
            exit 1

          fi


          jq \
            --arg version "$FEED_VERSION" \
            '.version = $version' \
            "$APPINFO" \
            > "${APPINFO}.new"


          mv \
            "${APPINFO}.new" \
            "$APPINFO"


          # ========================================================
          # Debian control metadata
          # ========================================================

          CONTROL_FILE="$(
            find control \
              -type f \
              -name control |
            head -n 1
          )"


          if [ -z "$CONTROL_FILE" ]; then

            echo "ERROR: control file not found."
            exit 1

          fi


          sed -i \
            "s/^Version:.*/Version: ${FEED_VERSION}/" \
            "$CONTROL_FILE"


          # ========================================================
          # Regenerate md5sums if present
          # ========================================================

          if [ -f control/md5sums ]; then

            (
              cd data

              find . \
                -type f \
                -print0 |
              sort -z |
              xargs -0 md5sum |
              sed \
                's#  \./#  #' \
                > ../control/md5sums
            )

          fi


          rm -f \
            "$CONTROL_ARCHIVE" \
            "$DATA_ARCHIVE"


          # ========================================================
          # Repack using original compression format
          # ========================================================

          pack_archive() {

            NAME="$1"
            SOURCE_DIR="$2"


            case "$NAME" in

              *.tar.gz|*.tgz)

                tar \
                  --numeric-owner \
                  --owner=0 \
                  --group=0 \
                  -czf "$NAME" \
                  -C "$SOURCE_DIR" .
                ;;


              *.tar.xz)

                tar \
                  --numeric-owner \
                  --owner=0 \
                  --group=0 \
                  -cJf "$NAME" \
                  -C "$SOURCE_DIR" .
                ;;


              *.tar.zst|*.tar.zstd)

                tar \
                  --numeric-owner \
                  --owner=0 \
                  --group=0 \
                  --zstd \
                  -cf "$NAME" \
                  -C "$SOURCE_DIR" .
                ;;


              *.tar.bz2)

                tar \
                  --numeric-owner \
                  --owner=0 \
                  --group=0 \
                  -cjf "$NAME" \
                  -C "$SOURCE_DIR" .
                ;;


              *)

                tar \
                  --numeric-owner \
                  --owner=0 \
                  --group=0 \
                  -cf "$NAME" \
                  -C "$SOURCE_DIR" .
                ;;

            esac

          }


          pack_archive \
            "$CONTROL_NAME" \
            control


          pack_archive \
            "$DATA_NAME" \
            data


          if [ ! -f debian-binary ]; then

            printf '2.0\n' \
              > debian-binary

          fi


          ar rcs \
            ../kodi-nightly.ipk \
            debian-binary \
            "$CONTROL_NAME" \
            "$DATA_NAME"


          cd ..


          echo
          echo "Repacked Nightly:"

          ls -lh kodi-nightly.ipk


          echo
          echo "Final SHA256:"

          sha256sum kodi-nightly.ipk


      # ============================================================
      # 6. Upload latest IPK to GitHub Release
      # ============================================================

      - name: Upload Kodi Nightly package
        if: steps.detect.outputs.changed == 'true'

        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}

          FEED_VERSION: ${{ steps.detect.outputs.feed_version }}

          DISPLAY_VERSION: ${{ steps.detect.outputs.display_version }}

          UPSTREAM_VERSION: ${{ steps.detect.outputs.upstream_version }}

          BUILD_DATE: ${{ steps.detect.outputs.build_date }}

          NEW_COMMIT: ${{ steps.detect.outputs.new_commit }}

          UPDATED_UTC: ${{ steps.detect.outputs.updated_utc }}

          COMMIT_COUNT: ${{ steps.changelog.outputs.commit_count }}

        run: |
          set -euo pipefail


          ASSET_NAME="org.xbmc.kodi_${FEED_VERSION}_arm.ipk"


          mv \
            kodi-nightly.ipk \
            "$ASSET_NAME"


          RELEASE_NOTES="$(
            cat <<EOF
          Kodi ${DISPLAY_VERSION} Nightly

          Nightly Build:
          ${BUILD_DATE}-${NEW_COMMIT}

          Homebrew Version:
          ${FEED_VERSION}

          Official webOS Package Version:
          ${UPSTREAM_VERSION}

          Commits Since Previous Nightly:
          ${COMMIT_COUNT}

          Feed Updated:
          ${UPDATED_UTC}

          Based on the official Kodi webOS master nightly.

          Kodi executables, libraries and resources are unchanged.

          Only webOS package version metadata is modified for Homebrew Channel update detection.
          EOF
          )"


          if ! gh release view \
            "$RELEASE_TAG" \
            >/dev/null 2>&1; then

            gh release create \
              "$RELEASE_TAG" \
              --title "Kodi webOS Nightly" \
              --notes "$RELEASE_NOTES"

          else

            gh release edit \
              "$RELEASE_TAG" \
              --title "Kodi webOS Nightly" \
              --notes "$RELEASE_NOTES"

          fi


          gh release upload \
            "$RELEASE_TAG" \
            "$ASSET_NAME" \
            --clobber


          # Only keep newest IPK
          gh release view \
            "$RELEASE_TAG" \
            --json assets \
            --jq '.assets[].name' |
          while read -r OLD_ASSET
          do

            if [ -n "$OLD_ASSET" ] && \
               [ "$OLD_ASSET" != "$ASSET_NAME" ]; then

              echo "Removing old asset: $OLD_ASSET"


              gh release delete-asset \
                "$RELEASE_TAG" \
                "$OLD_ASSET" \
                --yes || true

            fi

          done


          echo \
            "ASSET_NAME=$ASSET_NAME" \
            >> "$GITHUB_ENV"


      # ============================================================
      # 7. Generate Homebrew repo.json
      #
      # IMPORTANT:
      #
      # Full description is at package top level.
      # ============================================================

      - name: Generate Homebrew repository metadata
        if: steps.detect.outputs.changed == 'true'

        shell: bash

        env:
          SOURCE_FILE: ${{ steps.detect.outputs.file }}

          SOURCE_URL: ${{ steps.detect.outputs.source_url }}

          BUILD_DATE: ${{ steps.detect.outputs.build_date }}

          NEW_COMMIT: ${{ steps.detect.outputs.new_commit }}

          PREVIOUS_COMMIT: ${{ steps.detect.outputs.compare_from }}

          DISPLAY_VERSION: ${{ steps.detect.outputs.display_version }}

          UPSTREAM_VERSION: ${{ steps.detect.outputs.upstream_version }}

          FEED_VERSION: ${{ steps.detect.outputs.feed_version }}

          UPDATED_UTC: ${{ steps.detect.outputs.updated_utc }}

          COMMIT_COUNT: ${{ steps.changelog.outputs.commit_count }}

        run: |
          set -euo pipefail


          SHA256="$(
            sha256sum "$ASSET_NAME" |
            awk '{print $1}'
          )"


          SIZE="$(
            stat \
              -c '%s' \
              "$ASSET_NAME"
          )"


          ASSET_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ASSET_NAME}"


          export SHA256
          export SIZE
          export ASSET_URL


          python3 <<'PY'

          import json
          import os

          from pathlib import Path


          source_file = os.environ["SOURCE_FILE"]
          source_url = os.environ["SOURCE_URL"]

          build_date = os.environ["BUILD_DATE"]

          new_commit = os.environ["NEW_COMMIT"]

          previous_commit = os.environ.get(
              "PREVIOUS_COMMIT",
              ""
          )

          display_version = os.environ[
              "DISPLAY_VERSION"
          ]

          upstream_version = os.environ[
              "UPSTREAM_VERSION"
          ]

          feed_version = os.environ[
              "FEED_VERSION"
          ]

          updated_utc = os.environ[
              "UPDATED_UTC"
          ]

          commit_count = int(
              os.environ.get(
                  "COMMIT_COUNT",
                  "0"
              )
          )

          sha256 = os.environ["SHA256"]

          size = int(
              os.environ["SIZE"]
          )

          asset_url = os.environ[
              "ASSET_URL"
          ]


          icon_url = (
              "https://raw.githubusercontent.com/"
              "xbmc/xbmc/master/media/"
              "icon256x256.png"
          )


          # ========================================================
          # Full commit list
          # ========================================================

          commits_path = Path(
              "commits.md"
          )


          if commits_path.exists():

              commits_md = (
                  commits_path
                  .read_text(
                      encoding="utf-8"
                  )
                  .strip()
              )

          else:

              commits_md = (
                  "- Commit information unavailable."
              )


          # ========================================================
          # Compare URL
          # ========================================================

          compare_url = ""


          if previous_commit and new_commit:

              compare_url = (
                  "https://github.com/"
                  "xbmc/xbmc/compare/"
                  f"{previous_commit}..."
                  f"{new_commit}"
              )


          # ========================================================
          # Homebrew Description
          #
          # TOP-LEVEL package description
          # ========================================================

          description_parts = [

              f"# Kodi {display_version} Nightly",

              "",

              f"**Nightly Build:** "
              f"`{build_date}-{new_commit}`",

              "",

              f"**Homebrew Nightly Version:** "
              f"`{feed_version}`",

              "",

              f"**Official Kodi webOS Package Version:** "
              f"`{upstream_version}`",

              "",

              f"**Feed Updated:** "
              f"`{updated_utc}`",

              "",

              f"**Commits Since Previous Nightly:** "
              f"`{commit_count}`",

              "",

              "---",

              "",

              "## All Commits Since Previous Nightly",

              "",

              commits_md,

          ]


          if compare_url:

              description_parts.extend(
                  [

                      "",

                      "---",

                      "",

                      (
                          "[View full comparison "
                          "on Kodi GitHub]"
                          f"({compare_url})"
                      ),

                  ]
              )


          description_parts.extend(
              [

                  "",

                  "---",

                  "",

                  "## Package Information",

                  "",

                  (
                      "Based on the official Kodi "
                      "webOS master nightly:"
                  ),

                  "",

                  f"`{source_file}`",

                  "",

                  (
                      "Kodi executables, libraries "
                      "and resources are unchanged."
                  ),

                  "",

                  (
                      "Only the webOS package version "
                      "metadata is modified so Homebrew "
                      "Channel can distinguish individual "
                      "nightly builds."
                  ),

                  "",

                  "**Official Source:**",

                  "",

                  source_url,

              ]
          )


          description = "\n".join(
              description_parts
          )


          # ========================================================
          # repo.json
          # ========================================================

          repo = {

              "paging": {

                  "page": 1,

                  "count": 1,

                  "maxPage": 1,

                  "itemsTotal": 1

              },


              "packages": [

                  {

                      "id":
                          "org.xbmc.kodi",


                      "title":
                          "Kodi Nightly",


                      # Full Homebrew detail description
                      "description":
                          description,


                      "iconUri":
                          icon_url,


                      "manifest": {

                          "id":
                              "org.xbmc.kodi",


                          "version":
                              feed_version,


                          "type":
                              "native",


                          "title":
                              "Kodi Nightly",


                          # Short app description only
                          "appDescription":
                              "Official Kodi webOS master nightly",


                          "iconUri":
                              icon_url,


                          "sourceUrl":
                              "https://github.com/xbmc/xbmc",


                          "rootRequired":
                              False,


                          "ipkUrl":
                              asset_url,


                          "ipkHash": {

                              "sha256":
                                  sha256

                          },


                          "ipkSize":
                              size

                      }

                  }

              ]

          }


          with open(
              "repo.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  repo,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

              f.write("\n")


          # ========================================================
          # state.json
          # ========================================================

          state = {

              "sourceFile":
                  source_file,


              "sourceUrl":
                  source_url,


              "sourceCommit":
                  new_commit,


              "previousCommit":
                  previous_commit,


              "buildDate":
                  build_date,


              "feedVersion":
                  feed_version,


              "kodiDisplayVersion":
                  display_version,


              "upstreamVersion":
                  upstream_version,


              "updatedUTC":
                  updated_utc,


              "commitCount":
                  commit_count,


              "sha256":
                  sha256,


              "ipkSize":
                  size,


              "assetUrl":
                  asset_url

          }


          with open(
              "state.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  state,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

              f.write("\n")


          # ========================================================
          # CHANGELOG.md
          # ========================================================

          changelog_path = Path(
              "CHANGELOG.md"
          )


          old_changelog = ""


          if changelog_path.exists():

              old_changelog = (
                  changelog_path
                  .read_text(
                      encoding="utf-8"
                  )
              )


          header = (
              "# Kodi webOS Nightly Changelog\n\n"
          )


          if old_changelog.startswith(
              header
          ):

              old_changelog = (
                  old_changelog[
                      len(header):
                  ]
              )


          entry_parts = [

              (
                  f"## Kodi {display_version} "
                  f"— {build_date}-{new_commit}"
              ),

              "",

              (
                  f"**Homebrew Version:** "
                  f"`{feed_version}`"
              ),

              "",

              (
                  f"**Official webOS Package Version:** "
                  f"`{upstream_version}`"
              ),

              "",

              (
                  f"**Feed Updated:** "
                  f"`{updated_utc}`"
              ),

              "",

              (
                  f"**Commits:** "
                  f"{commit_count}"
              ),

              "",

              "### All Commits",

              "",

              commits_md,

          ]


          if compare_url:

              entry_parts.extend(
                  [

                      "",

                      (
                          "[Full Kodi GitHub comparison]"
                          f"({compare_url})"
                      )

                  ]
              )


          entry_parts.extend(
              [

                  "",

                  (
                      "Official Nightly Source: "
                      f"{source_url}"
                  ),

                  "",

                  "---",

                  ""

              ]
          )


          entry = "\n".join(
              entry_parts
          )


          changelog_path.write_text(

              header
              + entry
              + old_changelog,

              encoding="utf-8"

          )

          PY


          echo
          echo "=============================================="
          echo "Generated repo.json"
          echo "=============================================="
          echo

          cat repo.json

          echo


      # ============================================================
      # 8. Commit metadata
      # ============================================================

      - name: Commit repository update
        if: steps.detect.outputs.changed == 'true'

        shell: bash

        run: |
          set -euo pipefail


          git config \
            user.name \
            "Kodi Nightly Bot"


          git config \
            user.email \
            "actions@github.com"


          git add \
            repo.json \
            state.json \
            CHANGELOG.md


          if git diff \
            --cached \
            --quiet; then

            echo "Nothing changed."
            exit 0

          fi


          git commit \
            -m "Update Kodi nightly to ${{ steps.detect.outputs.build_date }}-${{ steps.detect.outputs.new_commit }}"


          git push
