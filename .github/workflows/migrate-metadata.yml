name: Fix Kodi Homebrew Description

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04

    env:
      EXPECTED_VERSION: "23.26.275"
      EXPECTED_COMMIT: "0056082c"
      PREVIOUS_COMMIT: "f889ea2d"
      KODI_DISPLAY_VERSION: "23.0-ALPHA1"
      KODI_UPSTREAM_VERSION: "22.90.701"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      - name: Verify current feed and generate description
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}

        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import json
          import html
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo


          repo_path = Path("repo.json")

          if not repo_path.exists():
              raise SystemExit("repo.json not found")


          with repo_path.open(
              "r",
              encoding="utf-8"
          ) as f:
              repo = json.load(f)


          package = repo["packages"][0]
          manifest = package["manifest"]


          current_version = manifest.get(
              "version",
              ""
          )


          expected_version = os.environ[
              "EXPECTED_VERSION"
          ]


          expected_commit = os.environ[
              "EXPECTED_COMMIT"
          ]


          previous_commit = os.environ[
              "PREVIOUS_COMMIT"
          ]


          if current_version != expected_version:
              raise SystemExit(
                  "Refusing migration: "
                  f"expected {expected_version}, "
                  f"found {current_version}"
              )


          state_path = Path(
              "state.json"
          )


          state = {}


          if state_path.exists():

              with state_path.open(
                  "r",
                  encoding="utf-8"
              ) as f:
                  state = json.load(f)


              state_commit = state.get(
                  "sourceCommit",
                  ""
              )


              if (
                  state_commit
                  and
                  state_commit != expected_commit
              ):
                  raise SystemExit(
                      "Refusing migration: "
                      "state.json already points to "
                      f"{state_commit}"
                  )


          token = os.environ[
              "GH_TOKEN"
          ]


          headers = {
              "Accept":
                  "application/vnd.github+json",

              "Authorization":
                  f"Bearer {token}",

              "User-Agent":
                  "Kodi-webOS-nightly-feed"
          }


          def api_get(url):

              request = urllib.request.Request(
                  url,
                  headers=headers
              )


              with urllib.request.urlopen(
                  request
              ) as response:

                  return json.load(
                      response
                  )


          # =====================================================
          # Resolve full commit hashes
          # =====================================================

          old_data = api_get(
              "https://api.github.com/repos/"
              "xbmc/xbmc/commits/"
              + previous_commit
          )


          new_data = api_get(
              "https://api.github.com/repos/"
              "xbmc/xbmc/commits/"
              + expected_commit
          )


          old_full = old_data[
              "sha"
          ]


          new_full = new_data[
              "sha"
          ]


          # =====================================================
          # Get ALL commits
          # =====================================================

          commits = []
          seen = set()

          page = 1


          while True:

              url = (
                  "https://api.github.com/repos/"
                  "xbmc/xbmc/compare/"
                  f"{old_full}...{new_full}"
                  f"?per_page=100&page={page}"
              )


              data = api_get(
                  url
              )


              page_commits = data.get(
                  "commits",
                  []
              )


              if not page_commits:
                  break


              for item in page_commits:

                  sha = item.get(
                      "sha",
                      ""
                  )


                  if not sha or sha in seen:
                      continue


                  seen.add(
                      sha
                  )


                  message = (
                      item
                      .get("commit", {})
                      .get("message", "")
                      .splitlines()[0]
                      .strip()
                  )


                  if not message:
                      message = (
                          "(no commit message)"
                      )


                  commits.append(
                      (
                          sha,
                          message
                      )
                  )


              if len(page_commits) < 100:
                  break


              page += 1


          # =====================================================
          # Time
          # =====================================================

          now_utc = datetime.now(
              timezone.utc
          )


          now_local = now_utc.astimezone(
              ZoneInfo(
                  "America/Los_Angeles"
              )
          )


          updated_utc = now_utc.strftime(
              "%Y-%m-%d %H:%M:%S UTC"
          )


          updated_local = now_local.strftime(
              "%Y-%m-%d %H:%M:%S %Z"
          )


          display_version = os.environ[
              "KODI_DISPLAY_VERSION"
          ]


          upstream_version = os.environ[
              "KODI_UPSTREAM_VERSION"
          ]


          build_date = state.get(
              "buildDate",
              "20261002"
          )


          # =====================================================
          # Generate Homebrew HTML description
          # =====================================================

          lines = [

              (
                  "<h2>Kodi "
                  + html.escape(display_version)
                  + " Nightly</h2>"
              ),

              (
                  "<p><b>Nightly Build:</b> "
                  "<code>"
                  + html.escape(
                      build_date
                      + "-"
                      + expected_commit
                  )
                  + "</code></p>"
              ),

              (
                  "<p><b>Homebrew Nightly Version:</b> "
                  "<code>"
                  + html.escape(current_version)
                  + "</code></p>"
              ),

              (
                  "<p><b>Official Kodi webOS "
                  "Package Version:</b> "
                  "<code>"
                  + html.escape(
                      upstream_version
                  )
                  + "</code></p>"
              ),

              (
                  "<p><b>Feed Updated:</b> "
                  + html.escape(updated_local)
                  + "</p>"
              ),

              (
                  "<p><b>Feed Updated (UTC):</b> "
                  + html.escape(updated_utc)
                  + "</p>"
              ),

              (
                  "<p><b>Commits Since Previous "
                  "Nightly:</b> "
                  + str(len(commits))
                  + "</p>"
              ),

              "<hr>",

              (
                  "<h3>All Commits Since "
                  "Previous Nightly</h3>"
              ),

              "<ul>"
          ]


          for sha, message in commits:

              short_sha = sha[:8]

              commit_url = (
                  "https://github.com/"
                  "xbmc/xbmc/commit/"
                  + sha
              )


              lines.append(
                  "<li>"
                  "<a href=\""
                  + html.escape(
                      commit_url,
                      quote=True
                  )
                  + "\">"
                  + html.escape(short_sha)
                  + "</a> "
                  + html.escape(message)
                  + "</li>"
              )


          lines.append(
              "</ul>"
          )


          compare_url = (
              "https://github.com/"
              "xbmc/xbmc/compare/"
              f"{old_full}...{new_full}"
          )


          lines.extend(
              [

                  "<hr>",

                  (
                      "<p><a href=\""
                      + html.escape(
                          compare_url,
                          quote=True
                      )
                      + "\">"
                      "View full Kodi GitHub comparison"
                      "</a></p>"
                  ),

                  "<hr>",

                  "<h3>Package Information</h3>",

                  (
                      "<p>Based on the official Kodi "
                      "webOS master nightly:</p>"
                  ),

                  (
                      "<p><code>"
                      "org.xbmc.kodi_"
                      + html.escape(build_date)
                      + "-"
                      + html.escape(expected_commit)
                      + "-master_arm.ipk"
                      "</code></p>"
                  ),

                  (
                      "<p>Kodi executables, libraries "
                      "and resources are unchanged.</p>"
                  ),

                  (
                      "<p>Only the webOS package version "
                      "metadata was modified so Homebrew "
                      "Channel can distinguish individual "
                      "nightly builds.</p>"
                  )

              ]
          )


          full_html = "\n".join(
              lines
          )


          Path(
              "full_description.html"
          ).write_text(
              full_html,
              encoding="utf-8"
          )


          # =====================================================
          # Correct Homebrew API fields
          # =====================================================

          repository = os.environ[
              "REPOSITORY"
          ]


          branch = os.environ[
              "BRANCH"
          ]


          full_description_url = (
              "https://raw.githubusercontent.com/"
              + repository
              + "/"
              + branch
              + "/full_description.html"
          )


          package[
              "shortDescription"
          ] = (
              "Kodi "
              + display_version
              + " Nightly · "
              + build_date
              + "-"
              + expected_commit
          )


          package[
              "fullDescriptionUrl"
          ] = full_description_url


          package[
              "pool"
          ] = package.get(
              "pool",
              "main"
          )


          # This field is not used by Homebrew Channel's
          # generated API format. Remove it to avoid confusion.
          package.pop(
              "description",
              None
          )


          manifest[
              "appDescription"
          ] = (
              "Kodi "
              + display_version
              + " Nightly"
          )


          # =====================================================
          # Preserve IPK information
          # =====================================================

          # Nothing below modifies:
          # version
          # ipkUrl
          # ipkHash
          # ipkSize


          with repo_path.open(
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  repo,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

              f.write(
                  "\n"
              )


          # =====================================================
          # State metadata only
          # =====================================================

          state[
              "sourceCommit"
          ] = expected_commit


          state[
              "previousCommit"
          ] = previous_commit


          state[
              "feedVersion"
          ] = current_version


          state[
              "kodiDisplayVersion"
          ] = display_version


          state[
              "upstreamVersion"
          ] = upstream_version


          state[
              "commitCount"
          ] = len(commits)


          state[
              "metadataUpdatedLocal"
          ] = updated_local


          state[
              "metadataUpdatedUTC"
          ] = updated_utc


          with state_path.open(
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  state,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

              f.write(
                  "\n"
              )


          # =====================================================
          # CHANGELOG.md
          # =====================================================

          changelog = [

              "# Kodi webOS Nightly Changelog",

              "",

              (
                  "## Kodi "
                  + display_version
                  + " — "
                  + build_date
                  + "-"
                  + expected_commit
              ),

              "",

              (
                  "**Homebrew Version:** `"
                  + current_version
                  + "`"
              ),

              "",

              (
                  "**Official webOS Package Version:** `"
                  + upstream_version
                  + "`"
              ),

              "",

              (
                  "**Feed Updated:** `"
                  + updated_local
                  + "`"
              ),

              "",

              (
                  "**Commits:** "
                  + str(len(commits))
              ),

              "",

              "### All Commits",

              ""
          ]


          for sha, message in commits:

              changelog.append(
                  "- [`"
                  + sha[:8]
                  + "`](https://github.com/"
                  "xbmc/xbmc/commit/"
                  + sha
                  + ") "
                  + message
              )


          changelog.extend(
              [

                  "",

                  (
                      "[Full Kodi GitHub comparison]("
                      + compare_url
                      + ")"
                  ),

                  ""

              ]
          )


          Path(
              "CHANGELOG.md"
          ).write_text(
              "\n".join(
                  changelog
              ),
              encoding="utf-8"
          )


          print()
          print(
              "Homebrew description migration complete."
          )

          print(
              "Version preserved:",
              manifest["version"]
          )

          print(
              "IPK URL preserved:",
              manifest["ipkUrl"]
          )

          print(
              "SHA256 preserved:",
              manifest["ipkHash"]["sha256"]
          )

          print(
              "Commits:",
              len(commits)
          )

          print(
              "Full description URL:",
              full_description_url
          )
          PY


      - name: Verify Homebrew fields
        shell: bash

        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Homebrew feed fields"
          echo "=========================================="

          jq '{
            version:
              .packages[0].manifest.version,

            shortDescription:
              .packages[0].shortDescription,

            fullDescriptionUrl:
              .packages[0].fullDescriptionUrl,

            appDescription:
              .packages[0].manifest.appDescription,

            ipkUrl:
              .packages[0].manifest.ipkUrl,

            sha256:
              .packages[0].manifest.ipkHash.sha256,

            ipkSize:
              .packages[0].manifest.ipkSize
          }' repo.json

          test -f full_description.html


      - name: Commit metadata fix
        shell: bash

        run: |
          set -euo pipefail

          git config \
            user.name \
            "Kodi Nightly Bot"

          git config \
            user.email \
            "actions@github.com"

          git add \
            repo.json \
            state.json \
            CHANGELOG.md \
            full_description.html

          if git diff \
            --cached \
            --quiet; then

            echo "Nothing changed."
            exit 0
          fi

          git commit \
            -m "Fix Homebrew full description"

          git push
