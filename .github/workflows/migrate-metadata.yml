name: Migrate Kodi Feed Metadata

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04

    env:
      EXPECTED_FEED_VERSION: "23.26.275"

      KODI_DISPLAY_VERSION: "23.0-ALPHA1"
      KODI_UPSTREAM_VERSION: "22.90.701"

      BUILD_DATE: "20261002"

      PREVIOUS_COMMIT: "f889ea2d"
      CURRENT_COMMIT: "0056082c"

      KODI_GITHUB_REPO: "xbmc/xbmc"

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      # ============================================================
      # 2. Safety check
      #
      # 防止以后已经升级到新 Nightly 时误运行这个一次性 Workflow
      # ============================================================

      - name: Verify current feed
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f repo.json ]; then
            echo "ERROR: repo.json not found."
            exit 1
          fi

          CURRENT_VERSION="$(
            jq -r '.packages[0].manifest.version // empty' repo.json
          )"

          if [ "$CURRENT_VERSION" != "$EXPECTED_FEED_VERSION" ]; then

            echo "ERROR:"
            echo "This migration is only for:"
            echo "$EXPECTED_FEED_VERSION"
            echo
            echo "Current repo version is:"
            echo "$CURRENT_VERSION"
            echo
            echo "Nothing was changed."

            exit 1
          fi


          # 如果 state.json 存在，再确认 commit
          if [ -f state.json ]; then

            STATE_COMMIT="$(
              jq -r '.sourceCommit // empty' state.json
            )"

            if [ -n "$STATE_COMMIT" ] && \
               [ "$STATE_COMMIT" != "$CURRENT_COMMIT" ]; then

              echo "ERROR:"
              echo "state.json already points to another Kodi commit:"
              echo "$STATE_COMMIT"
              echo
              echo "Expected:"
              echo "$CURRENT_COMMIT"
              echo
              echo "Nothing was changed."

              exit 1

            fi

          fi


          echo
          echo "Safety check passed."
          echo
          echo "Feed version:"
          echo "$CURRENT_VERSION"
          echo
          echo "Kodi commit:"
          echo "$CURRENT_COMMIT"


      # ============================================================
      # 3. Resolve full commit hashes
      # ============================================================

      - name: Resolve Kodi commit hashes
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail


          OLD_FULL="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${KODI_GITHUB_REPO}/commits/${PREVIOUS_COMMIT}" |
            jq -r '.sha'
          )"


          NEW_FULL="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${KODI_GITHUB_REPO}/commits/${CURRENT_COMMIT}" |
            jq -r '.sha'
          )"


          echo "Previous:"
          echo "$OLD_FULL"

          echo
          echo "Current:"
          echo "$NEW_FULL"


          {
            echo "old_full=$OLD_FULL"
            echo "new_full=$NEW_FULL"
          } >> "$GITHUB_OUTPUT"


      # ============================================================
      # 4. Get ALL commits
      #
      # 当前这两个 nightly 之间约几十个 commits，
      # 但这里仍然支持分页。
      # ============================================================

      - name: Get all commits
        id: changelog
        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}

          OLD_FULL: ${{ steps.resolve.outputs.old_full }}
          NEW_FULL: ${{ steps.resolve.outputs.new_full }}

        run: |
          set -euo pipefail


          rm -rf compare-pages
          mkdir -p compare-pages


          PAGE=1


          while true
          do

            URL="https://api.github.com/repos/${KODI_GITHUB_REPO}/compare/${OLD_FULL}...${NEW_FULL}?per_page=100&page=${PAGE}"

            echo "Fetching compare page ${PAGE}..."


            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$URL" \
              -o "compare-pages/page-${PAGE}.json"


            COUNT="$(
              jq '.commits | length' \
                "compare-pages/page-${PAGE}.json"
            )"


            echo "Commits returned: $COUNT"


            if [ "$COUNT" -eq 0 ]; then
              break
            fi


            if [ "$COUNT" -lt 100 ]; then
              break
            fi


            PAGE=$((PAGE + 1))

          done


          python3 <<'PY'
          import glob
          import json
          import re


          def page_number(path):
              m = re.search(r"page-(\d+)\.json$", path)
              return int(m.group(1)) if m else 0


          files = sorted(
              glob.glob("compare-pages/page-*.json"),
              key=page_number
          )


          commits = []
          seen = set()


          for filename in files:

              with open(
                  filename,
                  "r",
                  encoding="utf-8"
              ) as f:

                  data = json.load(f)


              for item in data.get("commits", []):

                  sha = item.get("sha", "")

                  if not sha or sha in seen:
                      continue

                  seen.add(sha)


                  message = (
                      item
                      .get("commit", {})
                      .get("message", "")
                      .splitlines()[0]
                      .strip()
                  )


                  if not message:
                      message = "(no commit message)"


                  # 防止破坏 Markdown
                  message = (
                      message
                      .replace("`", "'")
                      .replace("\r", " ")
                      .replace("\n", " ")
                  )


                  commits.append(
                      (
                          sha,
                          sha[:8],
                          message
                      )
                  )


          with open(
              "commits.md",
              "w",
              encoding="utf-8"
          ) as f:

              if not commits:

                  f.write(
                      "- No commits found between these nightly builds.\n"
                  )

              else:

                  for full_sha, short_sha, message in commits:

                      commit_url = (
                          "https://github.com/"
                          "xbmc/xbmc/commit/"
                          + full_sha
                      )

                      f.write(
                          f"- [`{short_sha}`]({commit_url}) "
                          f"{message}\n"
                      )


          with open(
              "commit-count.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(str(len(commits)))


          print(f"Total commits: {len(commits)}")
          PY


          COMMIT_COUNT="$(
            cat commit-count.txt
          )"


          echo "commit_count=$COMMIT_COUNT" \
            >> "$GITHUB_OUTPUT"


          echo
          echo "=============================================="
          echo "ALL COMMITS"
          echo "=============================================="
          echo

          cat commits.md

          echo
          echo "=============================================="


      # ============================================================
      # 5. Metadata update timestamp
      # ============================================================

      - name: Generate update timestamp
        id: time
        shell: bash

        run: |
          set -euo pipefail


          UPDATED_UTC="$(
            date -u \
              '+%Y-%m-%d %H:%M:%S UTC'
          )"


          UPDATED_LOCAL="$(
            TZ=America/Los_Angeles \
            date \
              '+%Y-%m-%d %H:%M:%S %Z'
          )"


          echo "UTC:"
          echo "$UPDATED_UTC"

          echo
          echo "Los Angeles:"
          echo "$UPDATED_LOCAL"


          {
            echo "updated_utc=$UPDATED_UTC"
            echo "updated_local=$UPDATED_LOCAL"
          } >> "$GITHUB_OUTPUT"


      # ============================================================
      # 6. Modify ONLY repo metadata
      #
      # NO IPK download
      # NO repackaging
      # NO Release modification
      # NO SHA change
      # NO version change
      # ============================================================

      - name: Migrate repo metadata
        shell: bash

        env:
          COMMIT_COUNT: ${{ steps.changelog.outputs.commit_count }}

          OLD_FULL: ${{ steps.resolve.outputs.old_full }}
          NEW_FULL: ${{ steps.resolve.outputs.new_full }}

          UPDATED_UTC: ${{ steps.time.outputs.updated_utc }}
          UPDATED_LOCAL: ${{ steps.time.outputs.updated_local }}

        run: |
          set -euo pipefail


          python3 <<'PY'
          import json
          import os
          from pathlib import Path


          repo_path = Path("repo.json")


          with repo_path.open(
              "r",
              encoding="utf-8"
          ) as f:

              repo = json.load(f)


          package = repo["packages"][0]
          manifest = package["manifest"]


          # ========================================================
          # Preserve current package metadata exactly
          # ========================================================

          feed_version = manifest["version"]

          ipk_url = manifest["ipkUrl"]
          ipk_hash = manifest["ipkHash"]
          ipk_size = manifest["ipkSize"]


          kodi_display_version = os.environ[
              "KODI_DISPLAY_VERSION"
          ]

          upstream_version = os.environ[
              "KODI_UPSTREAM_VERSION"
          ]

          build_date = os.environ[
              "BUILD_DATE"
          ]

          previous_commit = os.environ[
              "PREVIOUS_COMMIT"
          ]

          current_commit = os.environ[
              "CURRENT_COMMIT"
          ]

          old_full = os.environ[
              "OLD_FULL"
          ]

          new_full = os.environ[
              "NEW_FULL"
          ]

          updated_utc = os.environ[
              "UPDATED_UTC"
          ]

          updated_local = os.environ[
              "UPDATED_LOCAL"
          ]

          commit_count = int(
              os.environ["COMMIT_COUNT"]
          )


          commits_md = (
              Path("commits.md")
              .read_text(
                  encoding="utf-8"
              )
              .strip()
          )


          compare_url = (
              "https://github.com/"
              "xbmc/xbmc/compare/"
              f"{old_full}..."
              f"{new_full}"
          )


          # ========================================================
          # Correct Homebrew top-level description
          # ========================================================

          description = f"""# Kodi {kodi_display_version} Nightly

**Nightly Build:** `{build_date}-{current_commit}`

**Homebrew Nightly Version:** `{feed_version}`

**Official Kodi webOS Package Version:** `{upstream_version}`

**Feed Updated:** `{updated_local}`

**Feed Updated (UTC):** `{updated_utc}`

**Commits Since Previous Nightly:** `{commit_count}`

---

## All Commits Since Previous Nightly

{commits_md}

---

[View full comparison on Kodi GitHub]({compare_url})

---

## Package Information

Based on the official Kodi webOS master nightly:

`org.xbmc.kodi_{build_date}-{current_commit}-master_arm.ipk`

Kodi executables, libraries and resources are unchanged.

Only the webOS package version metadata was modified when this Homebrew package was originally generated so Homebrew Channel can distinguish nightly builds.
"""


          # ========================================================
          # Add correct TOP-LEVEL description
          # ========================================================

          package["description"] = description


          # ========================================================
          # appDescription becomes SHORT description only
          # ========================================================

          manifest["appDescription"] = (
              "Official Kodi webOS master nightly"
          )


          # ========================================================
          # Safety:
          #
          # Explicitly preserve these existing values.
          # ========================================================

          manifest["version"] = feed_version
          manifest["ipkUrl"] = ipk_url
          manifest["ipkHash"] = ipk_hash
          manifest["ipkSize"] = ipk_size


          with repo_path.open(
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  repo,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

              f.write("\n")


          # ========================================================
          # Update state.json metadata only
          #
          # sourceCommit/version stay unchanged.
          # ========================================================

          state_path = Path("state.json")


          if state_path.exists():

              with state_path.open(
                  "r",
                  encoding="utf-8"
              ) as f:

                  state = json.load(f)

          else:

              state = {}


          # Do NOT change sourceCommit if already correct
          state["sourceCommit"] = current_commit
          state["previousCommit"] = previous_commit

          state["feedVersion"] = feed_version

          state["kodiDisplayVersion"] = (
              kodi_display_version
          )

          state["upstreamVersion"] = (
              upstream_version
          )

          state["buildDate"] = build_date

          state["commitCount"] = commit_count

          state["metadataUpdatedLocal"] = (
              updated_local
          )

          state["metadataUpdatedUTC"] = (
              updated_utc
          )


          with state_path.open(
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  state,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

              f.write("\n")


          print(
              "Migration completed."
          )

          print(
              "Feed version preserved:",
              feed_version
          )

          print(
              "IPK URL preserved:",
              ipk_url
          )

          print(
              "IPK SHA256 preserved:",
              ipk_hash.get("sha256")
          )

          print(
              "IPK size preserved:",
              ipk_size
          )

          print(
              "Commits added:",
              commit_count
          )
          PY


      # ============================================================
      # 7. Rebuild current CHANGELOG entry
      # ============================================================

      - name: Update changelog
        shell: bash

        env:
          COMMIT_COUNT: ${{ steps.changelog.outputs.commit_count }}

          OLD_FULL: ${{ steps.resolve.outputs.old_full }}
          NEW_FULL: ${{ steps.resolve.outputs.new_full }}

          UPDATED_UTC: ${{ steps.time.outputs.updated_utc }}
          UPDATED_LOCAL: ${{ steps.time.outputs.updated_local }}

        run: |
          set -euo pipefail


          python3 <<'PY'
          import os
          from pathlib import Path


          feed_version = os.environ[
              "EXPECTED_FEED_VERSION"
          ]

          display_version = os.environ[
              "KODI_DISPLAY_VERSION"
          ]

          upstream_version = os.environ[
              "KODI_UPSTREAM_VERSION"
          ]

          build_date = os.environ[
              "BUILD_DATE"
          ]

          current_commit = os.environ[
              "CURRENT_COMMIT"
          ]

          old_full = os.environ[
              "OLD_FULL"
          ]

          new_full = os.environ[
              "NEW_FULL"
          ]

          commit_count = os.environ[
              "COMMIT_COUNT"
          ]

          updated_local = os.environ[
              "UPDATED_LOCAL"
          ]

          updated_utc = os.environ[
              "UPDATED_UTC"
          ]


          commits_md = (
              Path("commits.md")
              .read_text(
                  encoding="utf-8"
              )
              .strip()
          )


          compare_url = (
              "https://github.com/"
              "xbmc/xbmc/compare/"
              f"{old_full}..."
              f"{new_full}"
          )


          content = f"""# Kodi webOS Nightly Changelog

## Kodi {display_version} — {build_date}-{current_commit}

**Homebrew Version:** `{feed_version}`

**Official webOS Package Version:** `{upstream_version}`

**Feed Updated:** `{updated_local}`

**Feed Updated (UTC):** `{updated_utc}`

**Commits:** {commit_count}

### All Commits

{commits_md}

[Full Kodi GitHub comparison]({compare_url})

"""


          Path("CHANGELOG.md").write_text(
              content,
              encoding="utf-8"
          )
          PY


      # ============================================================
      # 8. Verify that package itself was NOT changed
      # ============================================================

      - name: Verify preserved package metadata
        shell: bash

        run: |
          set -euo pipefail


          echo
          echo "=============================================="
          echo "FINAL PACKAGE METADATA"
          echo "=============================================="

          jq '{
            version:
              .packages[0].manifest.version,

            ipkUrl:
              .packages[0].manifest.ipkUrl,

            sha256:
              .packages[0].manifest.ipkHash.sha256,

            ipkSize:
              .packages[0].manifest.ipkSize,

            appDescription:
              .packages[0].manifest.appDescription,

            hasTopLevelDescription:
              (.packages[0].description != null)
          }' repo.json


          VERSION="$(
            jq -r \
              '.packages[0].manifest.version' \
              repo.json
          )"


          if [ "$VERSION" != "$EXPECTED_FEED_VERSION" ]; then

            echo "ERROR: Version unexpectedly changed."
            exit 1

          fi


          echo
          echo "Version correctly preserved:"
          echo "$VERSION"


      # ============================================================
      # 9. Commit metadata only
      # ============================================================

      - name: Commit metadata migration
        shell: bash

        run: |
          set -euo pipefail


          git config \
            user.name \
            "Kodi Nightly Bot"


          git config \
            user.email \
            "actions@github.com"


          git add \
            repo.json \
            state.json \
            CHANGELOG.md


          if git diff \
            --cached \
            --quiet; then

            echo "No metadata changes detected."
            exit 0

          fi


          git commit \
            -m "Fix Kodi nightly feed description metadata"


          git push
